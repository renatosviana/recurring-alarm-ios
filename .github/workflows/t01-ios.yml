name: T01 iOS simulator validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select and validate Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(printf '%s\n' /Applications/Xcode_26*.app | sort | tail -n 1)"
          test -n "$xcode_app" || { echo 'Xcode 26 or later is not installed on this runner.' >&2; exit 1; }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcode_version="$(xcodebuild -version | awk '$1 == "Xcode" { print $2; exit }')"
          echo "Selected Xcode: $xcode_version"
          test "${xcode_version%%.*}" -ge 26 || { echo "Selected Xcode is too old: $xcode_version" >&2; exit 1; }
          iphoneos_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iPhoneOS SDK: $iphoneos_sdk"
          echo "iPhoneSimulator SDK: $simulator_sdk"
          test "${iphoneos_sdk%%.*}" -ge 26 || { echo "Selected iPhoneOS SDK is too old: $iphoneos_sdk" >&2; exit 1; }
          test "${simulator_sdk%%.*}" -ge 26 || { echo "Selected iPhoneSimulator SDK is too old: $simulator_sdk" >&2; exit 1; }

      - name: Validate architecture and scope contracts
        shell: bash
        run: bash scripts/validate-architecture.sh

      - name: Validate shared XCTest scheme
        shell: bash
        run: bash scripts/validate-xcode-test-config.sh

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$simulator_udid" || { echo 'No available iPhone simulator was found.' >&2; exit 1; }
          echo "Using simulator UDID: $simulator_udid"
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Build T01 for the iOS Simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project T01Prototype/T01PrototypeApp.xcodeproj \
            -scheme T01PrototypeApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$RUNNER_TEMP/t01-xcodebuild.log"

      - name: Run XCTest on the selected iPhone simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project T01Prototype/T01PrototypeApp.xcodeproj \
            -scheme T01PrototypeApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/t01-xcodebuild-tests.log"

      - name: Upload T01 build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: t01-xcodebuild-logs
          path: |
            ${{ runner.temp }}/t01-xcodebuild.log
            ${{ runner.temp }}/t01-xcodebuild-tests.log
          if-no-files-found: warn
