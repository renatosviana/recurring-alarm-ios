name: T01 TestFlight upload

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'App version, for example 0.1'
        required: true
        default: '0.1'
        type: string
      release_notes:
        description: 'Optional TestFlight release notes'
        required: false
        type: string

permissions:
  contents: read

jobs:
  archive-and-upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_IDENTIFIER: ${{ vars.T01_BUNDLE_IDENTIFIER }}
      TEAM_ID: ${{ vars.T01_TEAM_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
      APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select and validate Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          xcode_app="$(printf '%s\n' /Applications/Xcode_26*.app | sort | tail -n 1)"
          test -n "$xcode_app" || { echo 'Xcode 26 or later is not installed on this runner.' >&2; exit 1; }
          sudo xcode-select -s "$xcode_app/Contents/Developer"
          xcode_version="$(xcodebuild -version | awk '$1 == "Xcode" { print $2; exit }')"
          echo "Selected Xcode: $xcode_version"
          test "${xcode_version%%.*}" -ge 26 || { echo "Selected Xcode is too old: $xcode_version" >&2; exit 1; }
          iphoneos_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iPhoneOS SDK: $iphoneos_sdk"
          echo "iPhoneSimulator SDK: $simulator_sdk"
          sdk_version="$iphoneos_sdk"
          test "${sdk_version%%.*}" -ge 26 || { echo "Selected iPhoneOS SDK is too old: $sdk_version" >&2; exit 1; }
          test "${simulator_sdk%%.*}" -ge 26 || { echo "Selected iPhoneSimulator SDK is too old: $simulator_sdk" >&2; exit 1; }

      - name: Validate non-secret configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUNDLE_IDENTIFIER" || { echo 'Missing repository variable T01_BUNDLE_IDENTIFIER.' >&2; exit 1; }
          test "$BUNDLE_IDENTIFIER" != 'local.t01-alarm-probe' || { echo 'Replace the placeholder bundle identifier before uploading.' >&2; exit 1; }
          test -n "$TEAM_ID" || { echo 'Missing repository variable T01_TEAM_ID.' >&2; exit 1; }
          test -n "$APPSTORE_ISSUER_ID" || { echo 'Missing repository variable APPSTORE_ISSUER_ID.' >&2; exit 1; }
          test -n "$APPSTORE_API_KEY_ID" || { echo 'Missing repository variable APPSTORE_API_KEY_ID.' >&2; exit 1; }
          test -n "$APPSTORE_API_PRIVATE_KEY" || { echo 'Missing APPSTORE_API_PRIVATE_KEY secret.' >&2; exit 1; }
          test -n "$APPSTORE_CERTIFICATES_FILE_BASE64" || { echo 'Missing APPSTORE_CERTIFICATES_FILE_BASE64 secret.' >&2; exit 1; }
          test -n "$APPSTORE_CERTIFICATES_PASSWORD" || { echo 'Missing APPSTORE_CERTIFICATES_PASSWORD secret.' >&2; exit 1; }

      - name: Import Apple Distribution certificate into temporary keychain
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        id: profiles
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ vars.T01_BUNDLE_IDENTIFIER }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Select downloaded profile without printing its contents
        id: profile
        shell: bash
        env:
          PROFILES_JSON: ${{ steps.profiles.outputs.profiles }}
        run: |
          set -euo pipefail
          profile_name="$(python3 -c 'import json, os; p=json.loads(os.environ["PROFILES_JSON"]); print(p[0]["name"] if len(p) == 1 else "")')"
          test -n "$profile_name" || { echo 'Expected exactly one downloaded App Store profile.' >&2; exit 1; }
          echo 'profile-name<<PROFILE_NAME' >> "$GITHUB_OUTPUT"
          echo "$profile_name" >> "$GITHUB_OUTPUT"
          echo 'PROFILE_NAME' >> "$GITHUB_OUTPUT"

      - name: Calculate unique build number
        id: version
        shell: bash
        env:
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          [[ "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo 'marketing_version must contain only 1 to 3 numeric components.' >&2; exit 1; }
          build_number="$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))"
          echo "marketing-version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build-number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Using build number $build_number for this workflow run."

      - name: Create export options in the runner temp directory
        shell: bash
        env:
          EXPORT_OPTIONS: ${{ runner.temp }}/T01ExportOptions.plist
          PROFILE_NAME: ${{ steps.profile.outputs.profile-name }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$EXPORT_OPTIONS" PROFILE_NAME="$PROFILE_NAME" BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" TEAM_ID="$TEAM_ID" python3 - <<'PY'
          import os
          import plistlib

          options = {
              'method': 'app-store',
              'signingStyle': 'manual',
              'teamID': os.environ['TEAM_ID'],
              'provisioningProfiles': {
                  os.environ['BUNDLE_IDENTIFIER']: os.environ['PROFILE_NAME'],
              },
          }
          with open(os.environ['EXPORT_OPTIONS'], 'wb') as file:
              plistlib.dump(options, file)
          PY

      - name: Archive T01 for a signed iPhone build
        shell: bash
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/T01Prototype.xcarchive
          PROFILE_NAME: ${{ steps.profile.outputs.profile-name }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing-version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: |
          set -o pipefail
          xcodebuild \
            -project T01Prototype/T01PrototypeApp.xcodeproj \
            -scheme T01PrototypeApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive 2>&1 | tee "$RUNNER_TEMP/t01-archive.log"

      - name: Export signed IPA
        shell: bash
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/T01Prototype.xcarchive
          EXPORT_OPTIONS: ${{ runner.temp }}/T01ExportOptions.plist
          EXPORT_PATH: ${{ runner.temp }}/exported
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_PATH" 2>&1 | tee "$RUNNER_TEMP/t01-export.log"

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/exported/T01PrototypeApp.ipa
          app-type: ios
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: 'false'
          # The action's App Store API backend uses one 10-minute JWT and does
          # not refresh it while polling. Upload only; Apple processing is
          # checked separately in App Store Connect.
          wait-for-processing: 'false'

      - name: Report upload handoff
        run: echo 'IPA upload completed; Apple processing, review, and TestFlight acceptance remain pending in App Store Connect.'

      - name: Upload safe release diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: t01-testflight-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/t01-archive.log
            ${{ runner.temp }}/t01-export.log
          if-no-files-found: warn
